# Test suites on every pull request and every push to main.
# They talk only to local mock servers: no model, GPU, cloud service or secret is used.
# tests/run_offline.py finds the scripts by name, so a new tests/test_*.py runs here
# without editing this file.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline suites (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"          # the oldest version requirements.txt supports
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"          # the platform the harness is developed on
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # the suites run agent-written code and git commands
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the requirements
        run: python -m pip install -r requirements.txt
      - name: Run every offline suite
        run: python tests/run_offline.py

  browser:
    name: browser suite (ubuntu, Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the requirements and Playwright
        run: python -m pip install -r requirements.txt playwright
      - name: Show the Chrome the suite drives
        run: google-chrome --version
      - name: Run the browser suite (a skip fails the job)
        run: python tests/run_offline.py --browser
